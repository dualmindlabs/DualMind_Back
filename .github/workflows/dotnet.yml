name: Build and deploy ASP.NET 4.8 to Azure Web App

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/DualMind.API/DualMind.API.csproj

      - name: Build
        run: dotnet build src/DualMind.API/DualMind.API.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish src/DualMind.API/DualMind.API.csproj -c Release -o "${{ github.workspace }}\published" --no-build

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: <YOUR_AZURE_APP_SERVICE_NAME>
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: published
